---
- name: Check .env.prod exists (or bootstrap from .env once)
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ nextops_remote_dir }}"
    if [[ ! -f .env.prod ]]; then
      if [[ -f .env ]]; then
        echo 'NOTE: found .env but not .env.prod — copying .env -> .env.prod once'
        cp .env .env.prod
      else
        echo "ERROR: {{ nextops_remote_dir }}/.env.prod is missing." >&2
        echo 'Create it on the server (cp .env.example .env.prod && edit secrets).' >&2
        exit 1
      fi
    fi
    ln -sfn .env.prod .env
    sed -i '/^ORIGIN=$/d' .env.prod || true
    if ! grep -q '^ORIGIN=' .env.prod; then
      echo 'NOTE: ORIGIN is unset in .env.prod. adapter-node will assume https and issue Secure session cookies.'
      echo 'For plain HTTP set ORIGIN=http://<host>:<port> (e.g. ORIGIN=http://192.0.2.2:3003).'
    fi
    echo 'OK: .env.prod present'
  args:
    executable: /bin/bash
  register: nextops_env_prep
  changed_when: "'copying .env' in nextops_env_prep.stdout"

- name: Apply Direct Upstream Access to .env.prod
  ansible.builtin.include_tasks: direct_upstream.yml
