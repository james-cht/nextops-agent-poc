apiVersion: apps/v1
kind: Deployment
metadata:
  name: ge-sample
  namespace: ge-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ge-sample
  template:
    metadata:
      labels:
        app: ge-sample
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
