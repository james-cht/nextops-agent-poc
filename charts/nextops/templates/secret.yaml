{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextops.fullname" . }}
  labels:
    {{- include "nextops.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXTOPS_ADMIN_USER: {{ .Values.secrets.nextopsAdminUser | quote }}
  NEXTOPS_ADMIN_PASS: {{ .Values.secrets.nextopsAdminPass | quote }}
  NEXTOPS_DIFY_TOKEN: {{ .Values.secrets.nextopsDifyToken | quote }}
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  ROBUSTA_DB_USER: {{ .Values.secrets.robustaDbUser | quote }}
  ROBUSTA_DB_PASSWORD: {{ .Values.secrets.robustaDbPassword | quote }}
  ROBUSTA_ACTION_TOKEN: {{ .Values.secrets.robustaActionToken | quote }}
  PUBLIC_DEFAULT_ELASTICSEARCH_USER: {{ .Values.secrets.publicDefaultElasticsearchUser | quote }}
  PUBLIC_DEFAULT_ELASTICSEARCH_PASSWORD: {{ .Values.secrets.publicDefaultElasticsearchPassword | quote }}
  GMAIL_SA_KEY_FILE: {{ .Values.secrets.gmailSaKeyFile | quote }}
  GMAIL_DELEGATED_USER: {{ .Values.secrets.gmailDelegatedUser | quote }}
  GMAIL_OAUTH_TOKEN_FILE: {{ .Values.secrets.gmailOauthTokenFile | quote }}
  GMAIL_FROM: {{ .Values.secrets.gmailFrom | quote }}
  GMAIL_TO: {{ .Values.secrets.gmailTo | quote }}
  GOOGLE_CHAT_WEBHOOK_URL: {{ .Values.secrets.googleChatWebhookUrl | quote }}
  REPORT_PUBLIC_BASE_URL: {{ .Values.secrets.reportPublicBaseUrl | quote }}
  CHAT_OAUTH_TOKEN_FILE: {{ .Values.secrets.chatOauthTokenFile | quote }}
  GOOGLE_CHAT_SPACE: {{ .Values.secrets.googleChatSpace | quote }}
{{- end }}
