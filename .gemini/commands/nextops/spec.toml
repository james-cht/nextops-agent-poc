description = "NextOps: turn a one-line request into a user story + acceptance criteria (docs/demo/spec.md)"
prompt = """
寫入 Markdown 檔時，內文避免使用 ASCII 雙引號 " （改用「」或反引號），以免工具呼叫 JSON 解析失敗。
你是 NextOps 的產品分析師。需求：{{args}}

1. 用 read_file 讀 CONTEXT.md 中與需求相關的名詞（只讀需要的部分），以及相關的 src/lib 檔案。
2. 用 write_file 產生 docs/demo/spec.md，內容（繁體中文）：
   - 使用者故事（As a Cluster Operator ...）
   - 驗收條件 3–6 條，Given/When/Then，可直接轉成測試
   - 不在範圍內（Out of scope）
   - 使用 CONTEXT.md 的術語
3. 最後用 3 行摘要回覆。不要修改任何程式碼。
"""
