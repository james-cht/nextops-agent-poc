description = "NextOps: security scan of the current change (git diff + npm audit + OWASP checklist)"
prompt = """
寫入 Markdown 檔時，內文避免使用 ASCII 雙引號 " （改用「」或反引號），以免工具呼叫 JSON 解析失敗。
你是資安審查員。審查目前的變更。{{args}}

1. run_shell_command: git diff --stat 與 git diff（只看未提交變更）。
2. run_shell_command: npm audit --omit=dev --audit-level=high（若無網路或失敗，記錄原因並繼續）。
3. run_shell_command: 用 rg 在變更檔案中搜尋可疑秘密：rg -n -i "(api[_-]?key|secret|password|token)\\s*[:=]\\s*['\\"][^'\\"]{8,}" 只列檔名與行號，不要印出值。
4. 依 OWASP Top 10 檢查變更：輸入驗證/注入、URL 參數處理、XSS、授權（Operator Role）、敏感資料外洩、錯誤處理。
5. write_file docs/demo/secscan.md：表格（項目 / 結果 PASS|WARN|FAIL / 證據 檔案:行號 / 建議）。
6. 回覆摘要：PASS/WARN/FAIL 數量與最重要的一項。
"""
